name: moneynest
description: Your buddy-budget tracker

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter  

  auto_size_text: ^3.0.0
  auto_size_text_field: ^2.2.4
  calendar_date_picker2: ^2.0.1
  collection: ^1.19.1
  country_flags: ^3.2.0
  dotted_border: ^2.1.0
  fl_chart: ^0.66.0
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  expandable: ^5.0.1
  flex_color_scheme: ^8.2.0
  flutter_expandable_fab: ^2.3.0
  flutter_hooks: ^0.21.2
  flutter_local_notifications: ^19.2.1
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.3.2
  gap: ^3.0.1
  go_router: ^15.1.3
  google_fonts: ^6.2.1
  hooks_riverpod: ^2.6.1
  hugeicons: ^0.0.11
  image_picker: ^1.1.2
  intl: 0.20.2
  json_annotation: ^4.9.0
  lottie: ^3.1.3
  logging: ^1.2.0
  path: 
  path_provider: 
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.3
  syncfusion_flutter_datepicker: ^29.2.9
  syncfusion_flutter_charts: ^29.2.9
  toastification: ^3.0.3
  uuid: ^4.5.1
  wolt_modal_sheet: ^0.11.0
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  custom_lint:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.1"
  freezed: ^2.3.2
  json_serializable: ^6.9.3
  # riverpod_generator: ^2.6.4
  # riverpod_lint: ^2.6.4
  drift_dev: ^2.26.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/data/currencies.json

  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat/Montserrat-VariableFont_wght.ttf
          weight: 700
        - asset: fonts/Montserrat/Montserrat-Italic-VariableFont_wght.ttf
          style: italic

    - family: Urbanist
      fonts:
        - asset: fonts/Urbanist/Urbanist-VariableFont_wght.ttf
          weight: 700
        - asset: fonts/Urbanist/Urbanist-Italic-VariableFont_wght.ttf
          style: italic

